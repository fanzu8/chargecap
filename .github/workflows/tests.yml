name: tests

# Everything runs without a phone and without GTK: the daemon is driven against
# a fake sysfs tree, and the GUI is checked by reading its source.
on:
  push:
    branches: ["main"]
  pull_request:

# a newer push (or a re-run of the same commit) cancels the older test run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile the scripts
        run: |
          python3 -m py_compile chargecap daemon.py
          sh -n install.sh && sh -n uninstall.sh
      - name: run the test suite
        run: python3 -m unittest -v
