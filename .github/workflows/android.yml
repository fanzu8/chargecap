name: android

# The Android half.  Every change to it is built, and a version tag is released:
# the tag ships the *release* build -- signed with the key in the repository,
# minified, not debuggable -- so its file name says nothing about debug, while a
# branch or a PR gets the debug build and a name that says so.  See
# android/README.md, "Releases", and android/keystore/README.md for the key.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# only a tag needs it: that is what attaches the APK to a release
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 9 compiles Kotlin itself and wants JDK 17 or newer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      # the suite is stdlib Python and runs in half a second: a release should
      # not go out over a red one
      - name: run the test suite
        run: python3 -m unittest

      - name: read the version the build declares
        id: version
        working-directory: android
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test -n "$version" || { echo "no appVersion in android/app/build.gradle.kts" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chargecap $version for Android"

      - name: a version tag has to match the version the build declares
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match appVersion ${VERSION}:" >&2
            echo "bump appVersion in android/build.gradle.kts, or tag the commit" >&2
            echo "that declares it" >&2
            exit 1
          fi

      # chargecap-<version>-<abi>-<variant>.apk: the version without its v, the
      # ABIs the APK carries (universal = all of them in one file), and which
      # build it is -- no variant for the release, "-debug" when it is one.
      - name: decide what this run ships
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk=chargecap-${VERSION}-universal.apk" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk=chargecap-${VERSION}-universal-debug.apk" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        working-directory: android
        run: ./gradlew --no-daemon ${{ steps.build.outputs.task }}

      - name: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.build.outputs.apk }}
          DIR: ${{ steps.build.outputs.dir }}
        run: |
          set -euo pipefail
          built=$(ls android/app/build/outputs/apk/"$DIR"/*.apk | head -1)
          abis=$(unzip -l "$built" |
                 sed -n 's#.*lib/\([^/]*\)/[^/]*\.so#\1#p' |
                 sort -u | paste -sd, -)
          cp "$built" "$APK"
          sha256sum "$APK" | awk '{print $1"  "$2}' > SHA256SUMS

          # an APK is not a signed jar, so ask apksigner -- which lives in
          # build-tools, under whichever variable the setup action exported
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          actual=""
          certs=""
          if [ -n "$apksigner" ]; then
            certs=$("$apksigner" verify --print-certs "$APK")
            actual=$(echo "$certs" |
                     sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
            expected=$(keytool -list -v -keystore android/keystore/chargecap-release.p12 \
                       -storepass chargecap 2>/dev/null |
                       sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | head -1)
            if [ "$actual" != "$expected" ]; then
              # a debug build is signed with whatever debug key the machine
              # generated, so only the release has to carry our keystore's key
              if [ "$DIR" = "release" ]; then
                echo "::error title=signer mismatch::apk=${actual:-none} expected=${expected:-none}"
                echo "the APK was not signed by android/keystore:" >&2
                echo "  apk:      $actual" >&2
                echo "  expected: $expected" >&2
                exit 1
              fi
              echo "debug build: signed by $actual (its own debug key)" >&2
            fi
          else
            echo "no apksigner under '${sdk}' -- skipping the signer check" >&2
          fi
          # annotations are readable without a token, which is how a failing run
          # can be diagnosed from outside
          echo "::notice title=sdk::sdk=${sdk:-unset} apksigner=${apksigner:-none}"
          echo "::notice title=signer::apk=${actual:-none} expected=${expected:-none}"

          {
            echo "chargecap ${VERSION} (Android)"
            echo
            echo "file      $APK"
            echo "sha256    $(cut -d' ' -f1 SHA256SUMS)"
            echo "tag       ${GITHUB_REF_NAME}"
            echo "commit    ${GITHUB_SHA}"
            echo "built     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "abis      $abis"
            echo "signed by $(echo "${certs:-}" |
                             sed -n 's/^Signer #1 certificate DN: //p' | head -1)"
            echo "signer    ${actual}"
            echo "toolchain JDK $(java -version 2>&1 | head -1 |
                                      sed 's/.*"\(.*\)".*/\1/')"
          } > "chargecap-${VERSION}-build-info.txt"
          cat "chargecap-${VERSION}-build-info.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          path: |
            chargecap-*-universal*.apk
            SHA256SUMS
            chargecap-*-build-info.txt

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.build.outputs.apk }}
        run: |
          set -euo pipefail
          {
            cat android/RELEASE-NOTES.md
            echo
            echo "---"
            echo
            cat "chargecap-${VERSION}-build-info.txt"
          } > release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "$APK" SHA256SUMS "chargecap-${VERSION}-build-info.txt" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "chargecap ${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "chargecap ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "$APK" SHA256SUMS "chargecap-${VERSION}-build-info.txt"
          fi
